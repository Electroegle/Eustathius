  enabled: true
  allow_user_confirmation: true

web_ui:
  enabled: false
  host: 127.0.0.1
  port: 5000

browser_skill:
  headless: false           # true = no visible window (disables cursor swap)
  slow_mo_ms: 80            # ms delay between Playwright actions (visibility)
  max_steps: 50             # hard cap even in "no limit" mode
  stuck_limit: 3            # abort after N identical consecutive actions
  confirm_destructive: true # ask before click / type / upload
  session_log_dir: logs/browser_sessions
  viewport_width: 1280
  viewport_height: 800
