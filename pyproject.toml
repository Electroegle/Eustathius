[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts  = "-q --tb=short"

[project]
name    = "eustathius"
version = "6.0.0"
requires-python = ">=3.10"
description = "Local-first autonomous AI agent powered by Ollama"
readme  = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 110
target-version = "py310"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
